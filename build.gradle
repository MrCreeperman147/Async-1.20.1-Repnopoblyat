plugins {
    id 'idea'
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.common.mixins.json"
    config "${mod_id}.forge.mixins.json"
}

version = project.version
group = project.group
base { archivesName = "${mod_id}-${minecraft_version}" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${parchment_minecraft}"
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'eventbus.api.strictRuntimeChecks', 'true'
            args "--mixin.config=${mod_id}.common.mixins.json", "--mixin.config=${mod_id}.forge.mixins.json"
            mods {
                async {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { name = 'Bawnorton'; url = 'https://maven.bawnorton.com/releases' }
    maven { name = 'BawnortonMirror'; url = 'https://maven.enjarai.dev/mirrors' }
    maven { name = 'Forge'; url = 'https://maven.minecraftforge.net' }
    maven { name = 'Minecraft'; url = 'https://libraries.minecraft.net' }
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin Extras & Squared
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")
    implementation("com.github.bawnorton.mixinsquared:mixinsquared-forge:${mixinsquared_version}") { transitive = false }
    compileOnly("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}")
    annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // ASM
    implementation "org.ow2.asm:asm:9.5"
    implementation "org.ow2.asm:asm-tree:9.5"

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
}

processResources {
    def expandProps = [
        'version'                   : version,
        'group'                     : project.group,
        'minecraft_version'         : minecraft_version,
        'minecraft_version_range'   : minecraft_version_range,
        'mod_name'                  : mod_name,
        'mod_authors'               : mod_authors,
        'mod_id'                    : mod_id,
        'license'                   : license,
        'description'               : project.description,
        'forge_version'             : forge_version,
        'forge_loader_version_range': forge_loader_version_range,
        'java_version'              : java_version
    ]
    filesMatching(['pack.mcmeta', 'META-INF/mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : project.jar.archiveVersion,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : mod_authors,
            'Built-On-Minecraft'    : minecraft_version,
            'MixinConfigs'          : "${mod_id}.common.mixins.json,${mod_id}.forge.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea.module { downloadJavadoc = downloadSources = true }
